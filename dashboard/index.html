<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de Programação de Entregas — Omnia</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
  <link rel="icon" href="favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.png" type="image/png" sizes="24x24">
  <link rel="stylesheet" href="styles.css?v=20261109-6">
</head>
<body>
  <header class="top">
    <h1>Dashboard de Programação de Entregas — Omnia</h1>
    <p>1 carro = 1 contêiner (Importado) ou 1 OF (Nacional) · Data = previsão de entrega · America/Sao_Paulo · Dados atualizados em 09/11/2026</p>
  </header>
  <div class="wrap">
    <section class="card filters">
      <div class="fgrid">
        <div>
          <label class="fld" for="ini">Período</label>
          <div class="dates">
            <input id="ini" type="date" min="2026-08-01" max="2026-12-31" aria-label="Data inicial">
            <input id="fim" type="date" min="2026-08-01" max="2026-12-31" aria-label="Data final">
          </div>
        </div>
        <div>
          <label class="fld" for="transp">Transportadora</label>
          <select id="transp"></select>
        </div>
        <div>
          <label class="fld" for="origem">Origem</label>
          <select id="origem">
            <option value="todas">Todas</option>
            <option value="I">Importado</option>
            <option value="N">Nacional</option>
          </select>
        </div>
        <div>
          <label class="fld" for="situacao">Situação</label>
          <select id="situacao">
            <option value="todas">Todas</option>
            <option value="movimentar">A movimentar</option>
            <option value="entregue">Entregue</option>
            <option value="semBaixa">Sem baixa DRM</option>
          </select>
        </div>
      </div>
      <hr class="rule">
      <div class="chiphead">
        <div class="left">
          <span class="fld" style="margin:0">Transportadoras</span>
          <span class="badge" id="chip-badge"></span>
        </div>
        <div class="btns">
          <button type="button" class="ghost" id="sel-all">Selecionar todas</button>
          <button type="button" class="ghost" id="clear-chips">Limpar</button>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="countrow">
        <div class="count" id="count"></div>
        <button type="button" class="primary" id="reset">Limpar filtros</button>
      </div>
    </section>
    <nav class="tabs" role="tablist">
      <button type="button" class="tab on" data-tab="geral" role="tab">Visão Geral</button>
      <button type="button" class="tab" data-tab="dia" role="tab">Por Dia</button>
      <button type="button" class="tab" data-tab="transp" role="tab">Por Transportadora</button>
      <button type="button" class="tab" data-tab="detalhe" role="tab">Detalhe</button>
    </nav>
    <main id="view"></main>
  </div>
  <script src="data.js?v=20261109-6"></script>
  <script src="logic.js?v=20261109-6"></script>
  <script src="app.js?v=20261109-6"></script>
</body>
</html>
